# repo-extension protocol manifest — single declarative source for the
# extension's wire protocol (tools + session variables + lifecycle). Handler
# and resolver bindings stay in code (tools.go / variables.go).
id: repo
version: 0.3.1
lifecycle: [created, forked, renamed, deleted]
variables:
  - name: org
    scope: session
    description: Organization of the current workspace (session variable, from the mapping table).
    descriptions:
      zh: "当前工作区的组织（会话变量，来自映射表）。"
  - name: repo
    scope: session
    description: Repository name of the current workspace (session variable, from the mapping table).
    descriptions:
      zh: "当前工作区的仓库名称（会话变量，来自映射表）。"
  - name: bookmark
    scope: session
    description: Branch/bookmark of the current workspace (session variable, from the mapping table).
    descriptions:
      zh: "当前工作区所在分支/书签（会话变量，来自映射表）。"
tools:
  - name: read
    description: Read a file from the repository, returning line-numbered (1-based) content. Use offset/limit to read large files in segments.
    descriptions:
      zh: "读取仓库中的文件，返回带行号（从 1 开始）的内容。用 offset/limit 分段读取大文件。"
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: File path to read (relative to the repository root).
        offset:
          type: integer
          description: Starting line number (1-based, default 1).
        limit:
          type: integer
          description: Maximum number of lines to read (0/omitted = read to end of file).
      required: [path]
  - name: write
    description: Create or overwrite a file in the repository (committed as one change).
    descriptions:
      zh: "创建或覆盖仓库中的文件（作为一个变更提交）。"
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: File path to create/overwrite (relative to the repository root).
        content:
          type: string
          description: Full file content.
        message:
          type: string
          description: Commit message (defaults to "write <path>").
      required: [path, content]
  - name: delete
    description: Delete a file from the repository (committed as one change).
    descriptions:
      zh: "删除仓库中的文件（作为一个变更提交）。"
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: File path to delete (relative to the repository root).
        message:
          type: string
          description: Commit message (defaults to "delete <path>").
      required: [path]
  - name: edit
    description: Replace or insert file content by line number. Reads and validates the current file first, applies the line edit, then writes back with sha verification to prevent clobbering concurrent edits.
    descriptions:
      zh: "按行号替换或插入文件内容。先读取并校验当前文件，应用行编辑，再带 sha 校验写回，防止并发编辑互相覆盖。"
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: File path to edit (relative to the repository root).
        start_line:
          type: integer
          description: Start line (1-based); when end_line < start_line, inserts before start_line.
        end_line:
          type: integer
          description: End line (1-based, inclusive); less than start_line means insert mode.
        content:
          type: string
          description: Replacement or inserted content.
        message:
          type: string
          description: Commit message (defaults to "edit <path>").
      required: [path, start_line, end_line, content]
  - name: ls
    description: List files and directories in the repository tree.
    descriptions:
      zh: "列出仓库目录树中的文件与目录。"
    input_schema:
      type: object
      properties: {}
  - name: grep
    description: Search file contents with a regular expression.
    descriptions:
      zh: "使用正则表达式搜索文件内容。"
    input_schema:
      type: object
      properties:
        pattern:
          type: string
          description: Regular expression to search file contents.
      required: [pattern]
  - name: explore
    description: Browse the organization/repository/branch structure.
    descriptions:
      zh: "浏览组织/仓库/分支结构。"
    input_schema:
      type: object
      properties:
        org:
          type: string
          description: Organization name (omitted = list all organizations).
        repo:
          type: string
          description: Repository name (omitted = list all repositories in the org).
  - name: git-rebase
    description: Rebase the commits unique to `source` onto this session's branch (the current workspace bookmark). The current branch advances (linear history; source change ids are preserved). The destination is always the session's own branch and cannot be overridden.
    descriptions:
      zh: "把 `source` 分支上独有的提交变基到本会话分支（当前工作区书签）上。当前分支向前推进（线性历史；保留源码 change id）。目标始终是本会话自己的分支，不可覆盖。"
    input_schema:
      type: object
      properties:
        source:
          type: string
          description: Branch/bookmark whose commits are rebased onto the current workspace branch.
      required: [source]
  - name: git-resolve
    description: Resolve a conflict on this session's branch by writing the resolved content for a conflicted path. The branch tip must be in a conflicted state (e.g. after an unsuccessful rebase); read the path first (it renders with git-style conflict markers) to obtain the merged content, then write the final resolution here.
    descriptions:
      zh: "通过为冲突路径写入最终内容来解析本会话分支上的冲突。分支尖端必须处于冲突状态（例如一次失败的变基后）；先读取该路径（会渲染 git 风格冲突标记），得到合并内容后在此写入最终解析。"
    input_schema:
      type: object
      properties:
        path:
          type: string
          description: Repo-relative path of the conflicted file to resolve.
        content:
          type: string
          description: Full resolved file content to write at `path`.
      required: [path, content]
  - name: git-diff
    description: Compare file differences between two revisions, or the whole tree when `path` is omitted.
    descriptions:
      zh: "比较两个版本之间的文件差异；省略 path 时比较整棵树的差异。"
    input_schema:
      type: object
      properties:
        rev_a:
          type: string
          description: Start revision (change ID or bookmark).
        rev_b:
          type: string
          description: End revision (change ID or bookmark).
        path:
          type: string
          description: Optional file path; omitted = whole-tree diff between the two revisions.
      required: [rev_a, rev_b]
  - name: git-blame
    description: Annotate each line of a file with the change that introduced it.
    descriptions:
      zh: "逐行标注文件的变更来源。"
    input_schema:
      type: object
      properties:
        rev:
          type: string
          description: Revision to trace (change ID or bookmark; defaults to the branch head).
        path:
          type: string
          description: File path to trace.
      required: [rev, path]
  - name: git-log
    description: View commit history, optionally scoped to a branch and a time window.
    descriptions:
      zh: "查看提交历史，可限定分支与时间窗。"
    input_schema:
      type: object
      properties:
        rev:
          type: string
          description: "Branch/bookmark or change id to start from (default: current branch head)."
        since:
          type: string
          description: Inclusive lower time bound (YYYY-MM-DD or RFC3339).
        until:
          type: string
          description: Inclusive upper time bound (YYYY-MM-DD or RFC3339).
        limit:
          type: integer
          description: Maximum number of commits to return (default 50).
  - name: git-show
    description: View what a change modified.
    descriptions:
      zh: "查看某个变更修改了什么。"
    input_schema:
      type: object
      properties:
        rev:
          type: string
          description: Change ID.
      required: [rev]
  - name: git-branches
    description: List all branches (bookmarks).
    descriptions:
      zh: "列出所有分支（书签）。"
    input_schema:
      type: object
      properties: {}
