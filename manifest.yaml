# repo-extension protocol manifest — single declarative source for the
# extension's wire protocol (tools + session variables + lifecycle). Handler
# and resolver bindings stay in code (tools.go / variables.go).
id: repo
version: 0.3.1
lifecycle: [created, forked, renamed, deleted]
variables:
  - name: org
    scope: session
    description: 当前工作区所属组织（session 变量，来自映射表）
  - name: repo
    scope: session
    description: 当前工作区仓库名（session 变量，来自映射表）
  - name: bookmark
    scope: session
    description: 当前工作区分支/书签名（session 变量，来自映射表）
tools:
  - name: read
    description: 读取仓库中的文件，返回带行号(1-based)的内容。可用 offset/limit 分段读取大文件。
    input_schema:
      type: object
      properties:
        path: { type: string }
        offset: { type: integer }
        limit: { type: integer }
      required: [path]
  - name: write
    description: 在仓库中创建或覆盖一个文件（会自动提交为一次变更）。
    input_schema:
      type: object
      properties:
        path: { type: string }
        content: { type: string }
        message: { type: string }
      required: [path, content]
  - name: delete
    description: 删除仓库中的一个文件（会自动提交为一次变更）。
    input_schema:
      type: object
      properties:
        path: { type: string }
        message: { type: string }
      required: [path]
  - name: edit
    description: 按行号替换或插入文件内容。先读取校验当前文件，应用行编辑，再写回（带 sha 校验，防止覆盖他人修改）。
    input_schema:
      type: object
      properties:
        path: { type: string }
        start_line: { type: integer }
        end_line: { type: integer }
        content: { type: string }
        message: { type: string }
      required: [path, start_line, end_line, content]
  - name: ls
    description: 列出仓库树中的文件与目录。
    input_schema:
      type: object
      properties: {}
  - name: grep
    description: 用正则表达式搜索文件内容。
    input_schema:
      type: object
      properties:
        pattern: { type: string }
      required: [pattern]
  - name: explore
    description: 浏览项目的组织结构（org/repo/分支）。
    input_schema:
      type: object
      properties:
        org: { type: string }
        repo: { type: string }
  - name: git-diff
    description: 比较两个版本之间的文件差异。
    input_schema:
      type: object
      properties:
        rev_a: { type: string }
        rev_b: { type: string }
        path: { type: string }
      required: [rev_a, rev_b, path]
  - name: git-blame
    description: 标注文件每一行是由哪个变更引入的。
    input_schema:
      type: object
      properties:
        rev: { type: string }
        path: { type: string }
      required: [rev, path]
  - name: git-log
    description: 查看提交历史。
    input_schema:
      type: object
      properties:
        limit: { type: integer }
  - name: git-show
    description: 查看某个变更改动了什么。
    input_schema:
      type: object
      properties:
        rev: { type: string }
      required: [rev]
  - name: git-branches
    description: 列出所有分支（bookmarks）。
    input_schema:
      type: object
      properties: {}
